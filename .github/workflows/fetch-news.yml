name: Fetch FinancialJuice News

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and merge news
        run: python fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "fj-bot"
          git config user.email "fj-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Sin cambios, no se commitea."
          else
            git commit -m "auto: actualizar noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
